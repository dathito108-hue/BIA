name: BIA Core CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release
      - run: cargo run --release --example v11_bench
      - run: cargo run --release --example v12_bench
      - run: cargo run --release --example v14_stress
      - run: cargo run --release --example v15_reasoning
      - run: cargo run --release --example v16_generalization
