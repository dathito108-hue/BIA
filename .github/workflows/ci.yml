name: BIA Core CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: node scripts/product-runtime-test.cjs
      - run: cargo fmt
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release
      - run: cargo run --release --example v11_bench
      - run: cargo run --release --example v12_bench
      - run: cargo run --release --example v14_stress
      - run: cargo run --release --example v15_reasoning
      - run: cargo run --release --example v16_generalization
      - run: cargo run --release --example v18_open_reasoning
      - run: cargo run --release --example v21_deep_intelligence
      - run: cargo run --release --example v25_emergent_intelligence
      - run: cargo run --release --example v31_autonomous_knowledge
      - run: cargo run --release --example v37_deliberation
      - run: cargo run --release --example v45_max_intelligence
      - run: cargo run --release --example v61_learned_semantic
      - run: cargo run --release --example v81_continual_generative
      - run: cargo run --release --example v101_autonomous_loop
      - run: cargo run --release --example v130_evidence
      - run: cargo run --release --example v131_integrated
