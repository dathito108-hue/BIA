<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'"><title>Sản phẩm</title><link rel="stylesheet" href="style.css"><script defer src="config.js"></script><script defer src="core.js"></script><script defer src="app.js"></script></head>
<body><header><div class="wrap"><p class="eyebrow">CÔNG CỤ LÀM VIỆC · LƯU TRÊN THIẾT BỊ</p><h1 id="title"></h1><p id="brief"></p><p id="audience"></p></div></header><main class="wrap"><section class="card"><h2 id="kindTitle"></h2><p id="scope"></p><p id="message" role="status" aria-live="polite"></p><div id="summary" class="metric"></div></section><section class="card controls"><h2 id="formTitle">Thêm mới</h2><form id="editor"><div class="grid"><label>Tên / tiêu đề<input id="name" maxlength="120" required></label><label id="skuBox">Mã hàng<input id="sku" maxlength="60"></label><label id="qtyBox">Số lượng nguyên<input id="qty" type="number" min="0" max="1000000" step="1" value="1"></label><label id="priceBox">Đơn giá<input id="price" inputmode="decimal" value="0"></label><label id="thresholdBox">Ngưỡng tồn thấp<input id="threshold" type="number" min="0" max="1000000" value="0"></label><label id="dueBox">Hạn hoàn thành<input id="due" type="date"></label><label id="priorityBox">Ưu tiên<select id="priority"><option value="1">Cao</option><option value="2" selected>Vừa</option><option value="3">Thấp</option></select></label><label id="statusBox">Trạng thái<select id="status"><option value="todo">Chưa làm</option><option value="doing">Đang làm</option><option value="done">Hoàn tất</option></select></label></div><label>Ghi chú<input id="note" maxlength="500"></label><div class="actions"><button type="submit" id="save">Lưu dòng</button><button type="button" id="cancel" class="secondary">Hủy sửa</button></div></form></section><section class="card"><div class="actions controls"><label class="search">Tìm nhanh<input id="search" type="search" placeholder="Tên, mã hoặc ghi chú"></label><button id="csv" class="secondary">Xuất CSV</button><button id="backup" class="secondary">Sao lưu JSON</button><label class="file">Khôi phục JSON<input id="restore" type="file" accept="application/json,.json"></label><button id="print" class="secondary">In / PDF</button><button id="qa" class="secondary">Kiểm tra tích hợp</button></div><div class="tablewrap"><table><thead id="thead"></thead><tbody id="rows"></tbody></table></div><p id="empty">Chưa có dữ liệu. Thêm dòng đầu tiên ở trên.</p></section><footer><span id="author"></span><p>Dữ liệu chỉ nằm trong trình duyệt này. Hãy sao lưu định kỳ. Mã nguồn: Apache-2.0, xem LICENSE và NOTICE.</p></footer></main></body></html>
